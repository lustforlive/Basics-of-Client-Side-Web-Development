<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой проект</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>   
    <div class="top-bar">
        <div class="container">
            <div class="contact">
                <span>info@youremail.com</span>
                <span>(480) 555-0103</span>
            </div>
            <div class="social">
                <a href="ссылка_на_facebook"><i class="fab fa-facebook"></i></a>
                <a href="ссылка_на_инстаграм"><i class="fab fa-instagram"></i></a>
                <a href="ссылка_на_twitter"><i class="fab fa-twitter"></i></a>
                <a href="ссылка_на_youtube"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

    <div class="nav">
        <div class="container nav-wrapper">
            <div class="nav-left">
                <a href="#" class="active">HOME</a>
                <a href="#" class="header-text"> ABOUT</a>
                <a href="#" class="header-text">FEATURES</a>
                <a href="#" class="header-text">SCREENSHOT</a>
            </div>

            <div class="nav-right">
                <a href="#" class="header-text">BLOG</a>
                <a href="#" class="btn">DOWNLOAD</a>
                <a href="#" id="registerBtn" class="btn">REGISTER</a>
            </div>
        </div>
    </div>

    <div class="logo">
        <img src="logo.png" class="logo-image">
    </div>

    <dialog id="registerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Регистрация</h2>
                <button id="closeModalBtn" class="close-btn" aria-label="Закрыть">&times;</button>
            </div>
            
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Имя <span class="required-label">(обязательно)</span></label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        aria-required="true"
                        aria-describedby="name-error"
                        aria-live="polite"
                    >
                    <div id="name-error" class="error-message" hidden></div>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required-label">(обязательно)</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        aria-required="true"
                        aria-describedby="email-error"
                        aria-live="polite"
                    >
                    <div id="email-error" class="error-message" hidden></div>
                </div>

                <div class="form-group">
                    <label for="password">Пароль <span class="required-label">(обязательно, минимум 6 символов)</span></label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            minlength="6"
                            aria-required="true"
                            aria-describedby="password-error"
                            aria-live="polite"
                        >
                        <button 
                            type="button" 
                            id="showPasswordBtn" 
                            class="show-password-btn"
                            aria-label="Показать пароль"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div id="password-error" class="error-message" hidden></div>
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="submit-btn">Отправить</button>
                    <button type="button" id="cancelBtn" class="cancel-btn">Отмена</button>
                </div>
            </form>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
