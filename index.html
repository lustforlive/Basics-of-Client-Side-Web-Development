<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФИО - Лабораторная работа №5</title>
  <link rel="stylesheet" href="style.css">

  <script>
    (function () {
      const savedTheme = localStorage.getItem('app-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <header class="header">
    <h1>Иванов Иван Иванович - Лабораторная работа №5</h1>
    <button id="themeToggle" class="btn" type="button" aria-label="Переключить тему оформления">
      Сменить тему
    </button>
  </header>

  <main class="container">
    <section class="section" aria-labelledby="gallery-title">
      <div class="section-header">
        <h2 id="gallery-title">Галерея изображений</h2>
        <button id="reloadGalleryBtn" class="btn" type="button">Обновить галерею</button>
      </div>

      <div id="galleryLoader" class="loader" role="status" aria-label="Загрузка данных">
        <span class="spinner"></span> Загрузка картинок...
      </div>

      <div id="galleryContainer" class="gallery-grid" aria-live="polite"></div>
    </section>

    <section class="section" aria-labelledby="form-title">
      <h2 id="form-title">Отправка температуры аудитории</h2>
      
      <form id="temperatureForm" class="form" novalidate>
        <div class="form-group">
          <label for="roomInput">Номер аудитории:</label>
          <input 
            type="text" 
            id="roomInput" 
            name="room" 
            required 
            aria-required="true"
            placeholder="Например, 305А"
          >
        </div>

        <div class="form-group">
          <label for="tempInput">Температура (°C):</label>
          <input 
            type="number" 
            id="tempInput" 
            name="temperature" 
            step="0.1" 
            required 
            aria-required="true"
            placeholder="Например, 21.5"
          >
        </div>

        <button id="submitBtn" type="submit" class="btn btn-primary">Отправить данные</button>
      </form>
    </section>
  </main>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
